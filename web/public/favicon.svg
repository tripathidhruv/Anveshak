<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ANVESHAK: an "A" drawn as a money trail — victim → hub → the exchange the trace finds (gold). -->
  <defs>
    <linearGradient id="leg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4f12" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#ffb08a"/>
    </linearGradient>
    <radialGradient id="gold">
      <stop offset="0%" stop-color="#ffe3a3"/>
      <stop offset="100%" stop-color="#f5a524"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b0b0c"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M7.5 25 L16 6.5 L24.5 25" fill="none" stroke="url(#leg)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11.7 18.2 H20.3" stroke="#ff7a3d" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="7.5" cy="25" r="2.2" fill="#0b0b0c" stroke="#ff4f12" stroke-width="1.6"/>
  <circle cx="16" cy="6.5" r="2.3" fill="#fff4ee"/>
  <circle cx="24.5" cy="25" r="3" fill="url(#gold)"/>
</svg>
